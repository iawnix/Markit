[package]
name = "markit"
version = "0.4.0"
description = "A lightweight cross-platform Markdown editor"
authors = ["Markit contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "markit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "avif"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
