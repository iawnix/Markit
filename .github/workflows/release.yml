name: Release Markit

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.4.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: markit-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate release version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - run: npm ci
      - run: npx tsc -p apps/desktop/tsconfig.json --noEmit

      - name: Build Tauri bundles
        if: matrix.platform == 'linux'
        run: npx tauri build --config apps/desktop/src-tauri/tauri.conf.json --bundles appimage,deb,rpm

      - name: Build Tauri bundles
        if: matrix.platform == 'windows'
        run: npx tauri build --config apps/desktop/src-tauri/tauri.conf.json --bundles nsis

      - name: Build Tauri bundles
        if: matrix.platform == 'macos'
        run: npx tauri build --config apps/desktop/src-tauri/tauri.conf.json --bundles app,dmg

      - name: Prepare Linux release assets
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          output="apps/desktop/src-tauri/target/release/bundle"
          mkdir -p release-assets
          appimage="$(find "$output/appimage" -type f -name '*.AppImage' -print -quit)"
          deb="$(find "$output/deb" -type f -name '*.deb' -print -quit)"
          rpm="$(find "$output/rpm" -type f -name '*.rpm' -print -quit)"
          test -n "$appimage" -a -n "$deb" -a -n "$rpm"
          cp "$appimage" "release-assets/Markit-$version-Linux-x64.AppImage"
          cp "$deb" "release-assets/Markit-$version-Linux-x64.deb"
          cp "$rpm" "release-assets/Markit-$version-Linux-x64.rpm"
          test -x apps/desktop/src-tauri/target/release/markit
          tar -C apps/desktop/src-tauri/target/release -czf "release-assets/Markit-$version-Linux-x64.tar.gz" markit

      - name: Prepare Windows release assets
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $setup = Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $setup) { throw 'Tauri NSIS installer was not generated.' }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item -LiteralPath $setup.FullName -Destination "release-assets/Markit-$version-Windows-x64-Setup.exe"
          Compress-Archive -LiteralPath $setup.FullName -DestinationPath "release-assets/Markit-$version-Windows-x64.zip" -Force

      - name: Prepare macOS release assets
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          dmg="$(find apps/desktop/src-tauri/target/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mkdir -p release-assets
          cp "$dmg" "release-assets/Markit-$version-macOS-x64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Markit-${{ matrix.platform }}-release-assets
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate release tag
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version"

      - uses: actions/download-artifact@v4
        with:
          pattern: Markit-*-release-assets
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected=(
            "Markit-$version-Windows-x64-Setup.exe"
            "Markit-$version-Windows-x64.zip"
            "Markit-$version-macOS-x64.dmg"
            "Markit-$version-Linux-x64.AppImage"
            "Markit-$version-Linux-x64.deb"
            "Markit-$version-Linux-x64.rpm"
            "Markit-$version-Linux-x64.tar.gz"
          )
          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          printf '%s\n' "${actual[@]}"
          test "${#actual[@]}" -eq "${#expected[@]}"
          for name in "${expected[@]}"; do
            test -s "release-assets/$name"
            printf '%s\n' "${actual[@]}" | grep -Fxq "$name"
          done

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          notes_file="$RUNNER_TEMP/markit-release-notes.md"
          cat > "$notes_file" <<EOF
          ## Markit $version

          Cross-platform Tauri desktop build for Windows, macOS and Linux.

          Linux packages include AppImage, Debian, RPM and portable tar.gz builds.
          The Linux packages use the system WebKitGTK runtime documented in the repository.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GH_REPO" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --title "Markit $version" --notes-file "$notes_file" --draft=false --latest
          else
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --verify-tag --title "Markit $version" --notes-file "$notes_file" release-assets/*
          fi

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected=(
            "Markit-$version-Windows-x64-Setup.exe"
            "Markit-$version-Windows-x64.zip"
            "Markit-$version-macOS-x64.dmg"
            "Markit-$version-Linux-x64.AppImage"
            "Markit-$version-Linux-x64.deb"
            "Markit-$version-Linux-x64.rpm"
            "Markit-$version-Linux-x64.tar.gz"
          )
          for name in "${expected[@]}"; do
            gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name' | grep -Fxq "$name"
          done
