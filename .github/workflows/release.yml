name: Release Markit

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.4.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: markit-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate release version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - run: npm ci
      - run: npx tsc -p apps/desktop/tsconfig.json --noEmit
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build Tauri bundles
        if: matrix.platform == 'linux'
        run: npx tauri build --config apps/desktop/src-tauri/tauri.conf.json --bundles appimage,deb,rpm

      - name: Build Tauri bundles
        if: matrix.platform == 'windows'
        run: npx tauri build --config apps/desktop/src-tauri/tauri.conf.json --bundles nsis

      - name: Build Tauri bundles
        if: matrix.platform == 'macos'
        run: npx tauri build --config apps/desktop/src-tauri/tauri.conf.json --bundles app,dmg

      - name: Verify Linux bundle metadata
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          output="apps/desktop/src-tauri/target/release/bundle"
          appimage="$(find "$output/appimage" -type f -name '*.AppImage' -print -quit)"
          deb="$(find "$output/deb" -type f -name '*.deb' -print -quit)"
          rpm="$(find "$output/rpm" -type f -name '*.rpm' -print -quit)"
          test -n "$appimage" -a -n "$deb" -a -n "$rpm"
          test -x "$appimage"
          file "$appimage" | grep -Eiq 'appimage|squashfs|executable'
          dpkg-deb --info "$deb" | grep -Fq 'Package: markit'
          rpm -qip "$rpm" | grep -Eiq '^Name[[:space:]]*:[[:space:]]*markit'
          rm -rf appimage-check
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -f squashfs-root/usr/bin/markit
          rm -rf squashfs-root

      - name: Prepare Linux release assets
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          output="apps/desktop/src-tauri/target/release/bundle"
          mkdir -p release-assets
          appimage="$(find "$output/appimage" -type f -name '*.AppImage' -print -quit)"
          deb="$(find "$output/deb" -type f -name '*.deb' -print -quit)"
          rpm="$(find "$output/rpm" -type f -name '*.rpm' -print -quit)"
          test -n "$appimage" -a -n "$deb" -a -n "$rpm"
          cp "$appimage" "release-assets/Markit-$version-Linux-x64.AppImage"
          cp "$deb" "release-assets/Markit-$version-Linux-x64.deb"
          cp "$rpm" "release-assets/Markit-$version-Linux-x64.rpm"
          test -x apps/desktop/src-tauri/target/release/markit
          tar -C apps/desktop/src-tauri/target/release -czf "release-assets/Markit-$version-Linux-x64.tar.gz" markit
          npm run plugin:citations
          plugin_version="$(node -p "require('./plugins/citations/manifest.json').version")"
          cp "plugins/citations/dist/markit.citations.markit-plugin" "release-assets/Markit-citations-$plugin_version.markit-plugin"

      - name: Prepare Windows release assets
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $setup = Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          $binary = Get-Item 'apps/desktop/src-tauri/target/release/markit.exe'
          if ($null -eq $setup) { throw 'Tauri NSIS installer was not generated.' }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item -LiteralPath $setup.FullName -Destination "release-assets/Markit-$version-Windows-x64-Setup.exe"
          $portableDir = Join-Path $env:RUNNER_TEMP 'Markit-portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item -LiteralPath $binary.FullName -Destination (Join-Path $portableDir 'Markit.exe')
          Compress-Archive -LiteralPath (Join-Path $portableDir 'Markit.exe') -DestinationPath "release-assets/Markit-$version-Windows-x64.zip" -Force

      - name: Verify Windows release assets
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $setup = Get-Item "release-assets/Markit-$version-Windows-x64-Setup.exe"
          $zip = Get-Item "release-assets/Markit-$version-Windows-x64.zip"
          if ($setup.Length -le 1MB -or $zip.Length -le 1KB) { throw 'Windows release assets are unexpectedly small.' }
          $extract = Join-Path $env:RUNNER_TEMP 'Markit-zip-check'
          Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract
          $portable = Get-Item (Join-Path $extract 'Markit.exe')
          if ($portable.Length -le 1MB) { throw 'Portable Windows executable is unexpectedly small.' }
          [Diagnostics.FileVersionInfo]::GetVersionInfo($setup.FullName) | Out-String | Write-Output

      - name: Prepare macOS release assets
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          dmg="$(find apps/desktop/src-tauri/target/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          test "$(lipo -archs apps/desktop/src-tauri/target/release/bundle/macos/Markit.app/Contents/MacOS/markit)" = "arm64"
          mkdir -p release-assets
          cp "$dmg" "release-assets/Markit-$version-macOS-arm64.dmg"

      - name: Verify macOS release asset
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          dmg="release-assets/Markit-$version-macOS-arm64.dmg"
          test -s "$dmg"
          hdiutil imageinfo "$dmg" >/dev/null
          hdiutil verify "$dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Markit-${{ matrix.platform }}-release-assets
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate release tag
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version"

      - uses: actions/download-artifact@v4
        with:
          pattern: Markit-*-release-assets
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          plugin_version="$(node -p "require('./plugins/citations/manifest.json').version")"
          expected=(
            "Markit-$version-Windows-x64-Setup.exe"
            "Markit-$version-Windows-x64.zip"
            "Markit-$version-macOS-arm64.dmg"
            "Markit-$version-Linux-x64.AppImage"
            "Markit-$version-Linux-x64.deb"
            "Markit-$version-Linux-x64.rpm"
            "Markit-$version-Linux-x64.tar.gz"
            "Markit-citations-$plugin_version.markit-plugin"
          )
          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          printf '%s\n' "${actual[@]}"
          test "${#actual[@]}" -eq "${#expected[@]}"
          for name in "${expected[@]}"; do
            test -s "release-assets/$name"
            printf '%s\n' "${actual[@]}" | grep -Fxq "$name"
          done

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find release-assets -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' | sort)
          test "${#files[@]}" -gt 0
          (cd release-assets && sha256sum "${files[@]}") > release-assets/SHA256SUMS.txt
          (cd release-assets && sha256sum -c SHA256SUMS.txt)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          notes_file="$RUNNER_TEMP/markit-release-notes.md"
          cat > "$notes_file" <<EOF
          ## Markit $version

          Cross-platform Tauri desktop build for Windows, macOS and Linux.

          Linux packages include AppImage, Debian, RPM and portable tar.gz builds.
          The Linux packages use the system WebKitGTK runtime documented in the repository.
          SHA256SUMS.txt contains checksums for every binary and plugin asset.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GH_REPO" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --title "Markit $version" --notes-file "$notes_file" --draft=false --latest
          else
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --verify-tag --title "Markit $version" --notes-file "$notes_file" release-assets/*
          fi

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          plugin_version="$(node -p "require('./plugins/citations/manifest.json').version")"
          expected=(
            "Markit-$version-Windows-x64-Setup.exe"
            "Markit-$version-Windows-x64.zip"
            "Markit-$version-macOS-arm64.dmg"
            "Markit-$version-Linux-x64.AppImage"
            "Markit-$version-Linux-x64.deb"
            "Markit-$version-Linux-x64.rpm"
            "Markit-$version-Linux-x64.tar.gz"
            "Markit-citations-$plugin_version.markit-plugin"
            "SHA256SUMS.txt"
          )
          for name in "${expected[@]}"; do
            gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name' | grep -Fxq "$name"
          done
