name: Tauri build

on:
  workflow_dispatch:
  push:
    branches: [main, codex/**]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -p apps/desktop/tsconfig.json --noEmit
      - run: npm run tauri:frontend

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: appimage,deb,rpm
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - run: npm ci
      - run: npx tsc -p apps/desktop/tsconfig.json --noEmit
      - run: npx tauri build --config apps/desktop/src-tauri/tauri.conf.json --bundles ${{ matrix.bundles }}
      - name: Create Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $zipDir = 'apps/desktop/src-tauri/target/release/bundle/zip'
          $portableDir = Join-Path $env:RUNNER_TEMP 'Markit-portable'
          New-Item -ItemType Directory -Force -Path $zipDir | Out-Null
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item -LiteralPath 'apps/desktop/src-tauri/target/release/markit.exe' -Destination (Join-Path $portableDir 'Markit.exe') -Force
          Compress-Archive -LiteralPath (Join-Path $portableDir 'Markit.exe') -DestinationPath "$zipDir/Markit-$version-Windows-x64.zip" -Force
      - name: Upload Linux bundles
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Markit-Linux-x64
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
      - name: Upload Windows bundles
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Markit-Windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
      - name: Upload macOS bundles
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Markit-macOS-x64
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
